<!DOCTYPE html>
<html>
<head>
  <title>Valentine Quiz 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      background: #ffe6ec;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
      width: 90%;
      max-width: 350px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    h1 {
      color: #e6005c;
    }
    button {
      margin-top: 10px;
      padding: 12px;
      width: 100%;
      border: none;
      border-radius: 10px;
      background: #e6005c;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #cc0052;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>💘 Will you be my Valentine? 💘</h1>
    <p>(Just a cute question 😄)</p>

    <button onclick="alert('YAY! 💖 You made my day!')">Yes 💕</button>
    <button onclick="alert('Take your time 🤍')">Maybe 🤍</button>
    <button onclick="alert('Friends are precious too 😊')">Let’s stay friends 😊</button>
  </div>

</body>
</html>
